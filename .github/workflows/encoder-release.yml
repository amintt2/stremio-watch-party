# Publishes the GPU encoder app as a GitHub release (encoder-v<VERSION>) when encoder/VERSION
# changes on main. Installed apps whose update source is "GitHub" install it by themselves
# (encoder/update.go), after checking each file against SHA256SUMS.
name: Encoder release

on:
  push:
    branches: [main]
    paths: ['encoder/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Only main publishes (a manual run from another branch must not ship its build).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: encoder/go.sum
      - name: Version
        id: version
        run: |
          v="$(head -n1 encoder/VERSION | tr -d '[:space:]')"
          # Only a plain version number goes into the commands below.
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "VERSION invalide : $v" >&2; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          draft="$(gh release view "encoder-v$v" --json isDraft -q .isDraft 2>/dev/null || true)"
          if [ "$draft" = "true" ]; then
            # Left by a run that failed half-way: start it again.
            gh release delete "encoder-v$v" --yes
          elif [ -n "$draft" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Test
        if: steps.version.outputs.exists != 'true'
        run: cd encoder && go test ./...
      - name: Build
        if: steps.version.outputs.exists != 'true'
        run: sh encoder/build.sh "$PWD/out"
      - name: Publish
        if: steps.version.outputs.exists != 'true'
        # Draft first, files attached, then published: apps never see a release without its files.
        run: |
          tag="encoder-v$VERSION"
          gh release create "$tag" --draft --target "$GITHUB_SHA" \
            --title "Encodeur GPU $VERSION" \
            --notes "Encodeur GPU de Watch Party. Les apps réglées sur « GitHub » s'y mettent à jour toutes seules." \
            out/watchparty-encoder-* out/SHA256SUMS
          gh release edit "$tag" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
