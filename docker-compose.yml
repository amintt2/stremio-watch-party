# Backend + serveur de streaming Stremio privé. Prêt pour Coolify (build pack
# "Docker Compose") comme pour un `docker compose up -d --build` classique.
#
# Coolify : les variables ${...} apparaissent dans l'onglet "Environment Variables",
# et le domaine se met sur le service "watch-party" avec le port 3001
# (ex. https://watch.mciut.fr:3001). Seul ce service est exposé. Pour s'en servir aussi
# comme serveur de streaming dans les apps Stremio, ajoute un 2e domaine sur le port 11471
# (ex. https://watch.mciut.fr:3001,https://stremio.mciut.fr:11471).
services:
  watch-party:
    build: .
    environment:
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      STREAM_ADDON_URLS: ${STREAM_ADDON_URLS}
      META_ADDON_URL: ${META_ADDON_URL:-https://v3-cinemeta.strem.io/manifest.json}
      STREMIO_SERVER_URL: http://stremio:11470
      # Moteur torrent : "huwa" (service huwa ci-dessous, repli automatique sur Stremio
      # s'il ne répond pas) ou "stremio".
      TORRENT_ENGINE: ${TORRENT_ENGINE:-huwa}
      HUWA_ENGINE_URL: http://huwa:8080
      STREMIO_SELF_URL: http://127.0.0.1:11470
      # Stockage : taille max d'un torrent, et caches (Huwa télécharge ; Stremio ne sert
      # qu'en secours). Les liens débrid n'utilisent pas de disque.
      MAX_TORRENT_GB: ${MAX_TORRENT_GB:-15}
      STREMIO_CACHE_GB: ${STREMIO_CACHE_GB:-5}
      ALLOW_BROWSER_MODE: ${ALLOW_BROWSER_MODE:-0}
      # URL publique (https://watch.example.com) pour la connexion Discord hors Activité.
      # Vide = déduite de la requête.
      PUBLIC_URL: ${PUBLIC_URL:-}
      DATA_DIR: /app/data
      # Affichés sur /conditions et /confidentialite.
      LEGAL_OPERATOR: ${LEGAL_OPERATOR:-}
      LEGAL_CONTACT: ${LEGAL_CONTACT:-}
      # Serveur de streaming pour les apps Stremio (torrents par Huwa). 0 = désactivé.
      STREMIO_GATEWAY_PORT: ${STREMIO_GATEWAY_PORT:-11471}
    volumes:
      # Comptes, progression, bibliothèque (SQLite).
      - watch-party-data:/app/data
    expose:
      - "3001"
      - "11471"
    depends_on:
      - stremio
      - huwa
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  stremio:
    image: stremio/server:latest
    environment:
      NO_CORS: "1"
    volumes:
      - stremio-data:/root/.stremio-server
    # Pas de ports ni de domaine : seul le backend le joint, sur le réseau interne.
    #
    # Transcodage matériel AMD/Intel (Linux, VAAPI) : décommente si la machine a un GPU.
    # devices:
    #   - /dev/dri:/dev/dri
    restart: unless-stopped

  # Moteur torrent Huwa (librqbit + priorités de streaming, lecture anticipée, reprise
  # automatique). Il télécharge les torrents ; le serveur Stremio convertit en HLS en lisant
  # le fichier chez lui. Privé, comme stremio : aucun domaine, aucun port publié.
  huwa:
    # Pas de :latest tant que amintt2/huwa n'a pas d'étiquette de version v* : on épingle
    # une image sha-… publiée (celle-ci est testée avec Watch Party). HUWA_IMAGE_TAG pour changer.
    image: ghcr.io/amintt2/huwa:${HUWA_IMAGE_TAG:-sha-0968fdf}
    environment:
      HUWA_STREMIO_COMPAT: "1"
      # Watch Party : une source par salle en même temps, avec de la marge.
      HUWA_STREMIO_COMPAT_STREAMS: ${HUWA_STREAMS:-6}
      HUWA_CACHE_MAX_GB: ${HUWA_CACHE_GB:-20}
      # Seulement le moteur : ni app web, ni passerelle P2P, ni relais, ni transcodage
      # (c'est le serveur Stremio qui convertit).
      HUWA_WEB_DIR: "-"
      HUWA_P2P_GATEWAY: "0"
      HUWA_RELAY: "0"
      HUWA_TRANSCODE: "0"
      # Service privé : seul Watch Party l'appelle (course des sources), pas de limite par adresse.
      HUWA_SESSIONS_PER_IP: "0"
    volumes:
      - huwa-cache:/cache
      - huwa-data:/data
    restart: unless-stopped

volumes:
  stremio-data:
  huwa-cache:
  huwa-data:
  watch-party-data:
